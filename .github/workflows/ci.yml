name: CI — Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Least privilege: no job here writes checks or PR comments (verified: no step uses
# github-script / gh / the checks API), so contents: read is sufficient.
permissions:
  contents: read

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Reject tracked environment files
        shell: bash
        run: |
          set -euo pipefail
          tracked_env="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$' || true)"
          if [ -n "$tracked_env" ]; then
            echo "Tracked environment files are forbidden. Move secrets to the deployment environment and keep only .env.example in git."
            printf '%s\n' "$tracked_env"
            exit 1
          fi
          echo "No tracked environment secret files found."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: ✅ TypeScript check
        run: npm run check
        continue-on-error: false

      - name: ✅ Build verification
        run: npm run build
        continue-on-error: false

      # There is no `lint` script in package.json, so the previous step always echoed
      # "No lint script" and could never fail. Replaced by the commercial-eligibility
      # regression suite, which does fail on a leak (price, payment ask, foreign
      # number, fulfilment claim) and is run again before any deploy.
      - name: ✅ Commercial eligibility regression tests
        run: npm run validate:commercial && npm run test:commercial

      - name: Start production server for E2E
        shell: bash
        run: |
          set -euo pipefail
          DATABASE_URL="postgresql://localhost:5432/ci" \
          NODE_ENV=production \
          PORT=5000 \
          npm start > /tmp/aitp-ci-server.log 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for production server
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            http_code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5000/pricing || true)"
            if [ "$http_code" = "200" ]; then
              echo "Server is ready (attempt $i, status $http_code)"
              exit 0
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Server exited before becoming ready."
              cat /tmp/aitp-ci-server.log || true
              exit 1
            fi
            echo "Waiting for server... attempt $i (status ${http_code:-unavailable})"
            sleep 2
          done
          echo "Server did not become ready in time."
          cat /tmp/aitp-ci-server.log || true
          exit 1

      - name: ✅ Run E2E tests
        run: npx playwright test e2e/verify-all.spec.ts --reporter=list
        continue-on-error: false

      - name: 📊 Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full history for security scan
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 🔐 Dependency audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: 🔍 Check for secrets
        if: always()
        # Pinned to an immutable commit (release v3.99.9, resolved from the upstream repo's
        # tag ref on 2026-11-19). `@main` ran whatever the upstream branch held at run time.
        uses: trufflesecurity/trufflehog@3bd2b5887eb0efb8fa18bfd1d296032924e4ffdc
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          extra_args: --debug

  notify:
    runs-on: ubuntu-latest
    needs: [quality-checks, security-scan]
    if: always()

    steps:
      - name: 📬 Check results
        run: |
          if [ "${{ needs.quality-checks.result }}" = "success" ] && [ "${{ needs.security-scan.result }}" = "success" ]; then
            echo "✅ Required P0 checks passed - Ready for preview validation"
            exit 0
          else
            echo "❌ Required checks failed - Deployment blocked"
            exit 1
          fi
