name: CI — Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: ✅ TypeScript check
        run: npm run check
        continue-on-error: false

      - name: ✅ Build verification
        run: npm run build
        continue-on-error: false

      - name: ✅ Lint code
        run: npm run lint 2>/dev/null || echo "No lint script"
        continue-on-error: true

      - name: ✅ Run E2E tests
        run: npx playwright test e2e/verify-all.spec.ts --reporter=list
        continue-on-error: false

      - name: 📊 Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 🔐 Dependency audit
        run: npm audit --audit-level=moderate || true

      - name: 🔍 Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug

  notify:
    runs-on: ubuntu-latest
    needs: [quality-checks, security-scan]
    if: always()

    steps:
      - name: 📬 Check results
        run: |
          if [ "${{ needs.quality-checks.result }}" = "success" ] && [ "${{ needs.security-scan.result }}" = "success" ]; then
            echo "✅ All checks passed - Ready for deployment"
            exit 0
          else
            echo "❌ Some checks failed - Deployment blocked"
            exit 1
          fi
