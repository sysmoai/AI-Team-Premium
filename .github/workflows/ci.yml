name: CI — Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Reject tracked environment files
        shell: bash
        run: |
          set -euo pipefail
          tracked_env="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$' || true)"
          if [ -n "$tracked_env" ]; then
            echo "Tracked environment files are forbidden. Move secrets to the deployment environment and keep only .env.example in git."
            printf '%s\n' "$tracked_env"
            exit 1
          fi
          echo "No tracked environment secret files found."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: ✅ TypeScript check
        run: npm run check
        continue-on-error: false

      - name: ✅ Build verification
        run: npm run build
        continue-on-error: false

      - name: ✅ Lint code
        run: npm run lint 2>/dev/null || echo "No lint script"
        continue-on-error: true

      - name: Start production server for E2E
        shell: bash
        run: |
          set -euo pipefail
          DATABASE_URL="postgresql://localhost:5432/ci" \
          NODE_ENV=production \
          PORT=5000 \
          npm start > /tmp/aitp-ci-server.log 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for production server
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            http_code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5000/pricing || true)"
            if [ "$http_code" = "200" ]; then
              echo "Server is ready (attempt $i, status $http_code)"
              exit 0
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Server exited before becoming ready."
              cat /tmp/aitp-ci-server.log || true
              exit 1
            fi
            echo "Waiting for server... attempt $i (status ${http_code:-unavailable})"
            sleep 2
          done
          echo "Server did not become ready in time."
          cat /tmp/aitp-ci-server.log || true
          exit 1

      - name: ✅ Run E2E tests
        run: npx playwright test e2e/verify-all.spec.ts --reporter=list
        continue-on-error: false

      - name: 📊 Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 🔐 Dependency audit
        run: npm audit --audit-level=moderate || true

      - name: 🔍 Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug

  notify:
    runs-on: ubuntu-latest
    needs: [quality-checks, security-scan]
    if: always()

    steps:
      - name: 📬 Check results
        run: |
          if [ "${{ needs.quality-checks.result }}" = "success" ] && [ "${{ needs.security-scan.result }}" = "success" ]; then
            echo "✅ All checks passed - Ready for deployment"
            exit 0
          else
            echo "❌ Some checks failed - Deployment blocked"
            exit 1
          fi
