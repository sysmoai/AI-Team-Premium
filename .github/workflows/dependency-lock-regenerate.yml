name: Temporary dependency lock regeneration

on:
  push:
    branches:
      - fix/dependency-audit-20260903

permissions:
  contents: write

jobs:
  regenerate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/dependency-audit-20260903
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Regenerate npm lockfile from package constraints
        run: npm install --package-lock-only --ignore-scripts

      - name: Clean audit at moderate threshold
        run: npm audit --audit-level=moderate

      - name: Reproducible install
        run: npm ci --ignore-scripts

      - name: TypeScript
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Commercial validation
        run: npm run validate:commercial

      - name: Offline verification
        run: npm run verify

      - name: Commit npm-generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches package constraints"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security: regenerate lockfile for patched dependencies"
          git push origin HEAD:fix/dependency-audit-20260903
