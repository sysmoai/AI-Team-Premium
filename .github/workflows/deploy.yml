name: Deploy to Cloudflare Pages

# DISABLED: this project deploys to Vercel, not Cloudflare Pages.
# Left in place for reference; run manually only.
on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        continue-on-error: true

      - name: Build project
        run: npm run build || echo "Build optional for this project"
        continue-on-error: true

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Deploying with Account ID..."
            wrangler pages deploy . --project-name=${{ github.event.repository.name }} || true
          else
            echo "Account ID not set, deployment will use OAuth flow on first run"
            wrangler pages deploy . --project-name=${{ github.event.repository.name }} || true
          fi
        continue-on-error: true
