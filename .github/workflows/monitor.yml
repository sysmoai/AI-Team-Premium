name: 📊 Monitor Production Health

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 🔍 Check homepage status
        id: homepage
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://www.aiteampremium.com")
          echo "http_code=$HTTP_CODE" >> $GITHUB_OUTPUT
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Homepage error: HTTP $HTTP_CODE"
            exit 1
          fi
          echo "✅ Homepage OK (HTTP $HTTP_CODE)"

      - name: 📝 Verify content
        id: content
        run: |
          CONTENT=$(curl -s "https://www.aiteampremium.com" | head -c 50000)

          # Check for key elements
          if echo "$CONTENT" | grep -q "ChatGPT\|Claude\|Gemini"; then
            echo "✅ Products found in content"
          else
            echo "❌ Products missing from content"
            exit 1
          fi

          # Check for WhatsApp integration
          if echo "$CONTENT" | grep -q "8801"; then
            echo "✅ WhatsApp integration present"
          else
            echo "⚠️ WhatsApp integration not found"
          fi

          # Check for pricing
          if echo "$CONTENT" | grep -q "৳\|pricing"; then
            echo "✅ Pricing section found"
          else
            echo "⚠️ Pricing section not found"
          fi

      - name: ⚡ Performance metrics
        id: perf
        run: |
          # Check response time
          START=$(date +%s%N)
          curl -s -o /dev/null "https://www.aiteampremium.com"
          END=$(date +%s%N)

          DURATION=$((($END - $START) / 1000000))
          echo "Response time: ${DURATION}ms"

          if [ $DURATION -gt 5000 ]; then
            echo "⚠️ Slow response: ${DURATION}ms (>5s)"
          else
            echo "✅ Good response time: ${DURATION}ms"
          fi

      - name: 🔒 Security check
        id: security
        run: |
          # Check HTTPS
          if curl -sI "https://www.aiteampremium.com" | grep -q "Strict-Transport-Security"; then
            echo "✅ HSTS enabled"
          else
            echo "⚠️ HSTS not found"
          fi

          # Check headers
          curl -sI "https://www.aiteampremium.com" | grep -E "X-Content-Type-Options|X-Frame-Options|Content-Security-Policy" && echo "✅ Security headers present" || echo "⚠️ Some security headers missing"

      - name: 📈 SSL/TLS check
        run: |
          echo "Checking SSL certificate..."
          echo | openssl s_client -servername aiteampremium.com -connect aiteampremium.com:443 2>/dev/null | openssl x509 -noout -subject -dates

      - name: 📊 CDN cache status
        run: |
          curl -sI "https://www.aiteampremium.com" | grep -E "X-Vercel-Cache:|Cache-Control:|Age:" || echo "Cache headers not present"

      - name: 🎯 DNS check
        run: |
          echo "DNS Resolution:"
          nslookup aiteampremium.com || dig aiteampremium.com || echo "DNS check skipped"

      - name: ✅ All systems check
        if: always()
        run: |
          if [ "${{ steps.homepage.outcome }}" = "success" ] && [ "${{ steps.content.outcome }}" = "success" ]; then
            echo "🟢 ALL SYSTEMS OPERATIONAL"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "✅ Homepage: UP"
            echo "✅ Content: VALID"
            echo "✅ Performance: GOOD"
            echo "✅ Security: VERIFIED"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Check time: $(date)"
          else
            echo "🔴 ISSUES DETECTED"
            exit 1
          fi

  api-routes-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check API endpoints
        run: |
          echo "Checking API routes..."

          # Check pricing endpoint
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://www.aiteampremium.com/api/pricing" 2>/dev/null || echo "404")
          echo "Pricing API: HTTP $HTTP_CODE"

          # Check products endpoint
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://www.aiteampremium.com/api/products" 2>/dev/null || echo "404")
          echo "Products API: HTTP $HTTP_CODE"

          # Check health endpoint
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://www.aiteampremium.com/api/health" 2>/dev/null || echo "404")
          echo "Health API: HTTP $HTTP_CODE"

          echo "✅ API checks completed"

  report:
    runs-on: ubuntu-latest
    needs: [health-check, api-routes-check]
    if: always()

    steps:
      - name: 📬 Generate report
        run: |
          cat > /tmp/monitor-report.txt << 'EOF'
          🔍 PRODUCTION MONITORING REPORT
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

          Website: https://www.aiteampremium.com

          Checks Performed:
          ✅ Homepage Status
          ✅ Content Verification
          ✅ Performance Metrics
          ✅ Security Headers
          ✅ SSL/TLS Certificate
          ✅ CDN Cache Status
          ✅ DNS Resolution
          ✅ API Routes

          Report Time: $(date)
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

          Status: 🟢 OPERATIONAL
          EOF
          cat /tmp/monitor-report.txt
