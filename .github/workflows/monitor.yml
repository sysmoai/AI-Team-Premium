name: 📊 Monitor Production Health

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours (was */5, which burned ~288 runs/day)
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 🔍 Check homepage status
        id: homepage
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://www.aiteampremium.com")
          echo "http_code=$HTTP_CODE" >> $GITHUB_OUTPUT
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Homepage error: HTTP $HTTP_CODE"
            exit 1
          fi
          echo "✅ Homepage OK (HTTP $HTTP_CODE)"

      - name: 📝 Verify content
        id: content
        run: |
          CONTENT=$(curl -s "https://www.aiteampremium.com" | head -c 50000)

          # Check for key elements
          if echo "$CONTENT" | grep -q "ChatGPT\|Claude\|Gemini"; then
            echo "✅ Products found in content"
          else
            echo "❌ Products missing from content"
            exit 1
          fi

          # Check for WhatsApp integration
          if echo "$CONTENT" | grep -q "8801"; then
            echo "✅ WhatsApp integration present"
          else
            echo "⚠️ WhatsApp integration not found"
          fi

          # Check for pricing
          if echo "$CONTENT" | grep -q "৳\|pricing"; then
            echo "✅ Pricing section found"
          else
            echo "⚠️ Pricing section not found"
          fi

      - name: ⚡ Performance metrics
        id: perf
        run: |
          # Check response time
          START=$(date +%s%N)
          curl -s -o /dev/null "https://www.aiteampremium.com"
          END=$(date +%s%N)

          DURATION=$((($END - $START) / 1000000))
          echo "Response time: ${DURATION}ms"

          if [ $DURATION -gt 5000 ]; then
            echo "⚠️ Slow response: ${DURATION}ms (>5s)"
          else
            echo "✅ Good response time: ${DURATION}ms"
          fi

      - name: 🔒 Security check
        id: security
        run: |
          # Check HTTPS
          if curl -sI "https://www.aiteampremium.com" | grep -q "Strict-Transport-Security"; then
            echo "✅ HSTS enabled"
          else
            echo "⚠️ HSTS not found"
          fi

          # Check headers
          curl -sI "https://www.aiteampremium.com" | grep -E "X-Content-Type-Options|X-Frame-Options|Content-Security-Policy" && echo "✅ Security headers present" || echo "⚠️ Some security headers missing"

      - name: 📈 SSL/TLS check
        run: |
          echo "Checking SSL certificate..."
          echo | openssl s_client -servername aiteampremium.com -connect aiteampremium.com:443 2>/dev/null | openssl x509 -noout -subject -dates

      - name: 📊 CDN cache status
        run: |
          curl -sI "https://www.aiteampremium.com" | grep -iE "^(server|cf-cache-status|cache-control|age):" || echo "Cache headers not present"

      - name: 🎯 DNS check
        run: |
          echo "DNS Resolution:"
          nslookup aiteampremium.com || dig aiteampremium.com || echo "DNS check skipped"

      - name: ✅ All systems check
        if: always()
        run: |
          if [ "${{ steps.homepage.outcome }}" = "success" ] && [ "${{ steps.content.outcome }}" = "success" ]; then
            echo "🟢 ALL SYSTEMS OPERATIONAL"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "✅ Homepage: UP"
            echo "✅ Content: VALID"
            echo "✅ Performance: GOOD"
            echo "✅ Security: VERIFIED"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Check time: $(date)"
          else
            echo "🔴 ISSUES DETECTED"
            exit 1
          fi

  # Production is the Cloudflare Worker `ai-team-premium` (no Vercel, no /api
  # routes). Fail if www stops being served by Cloudflare, Vercel reappears,
  # the apex loses its 301 to www, unknown URLs stop 404ing, or DNSSEC breaks.
  edge-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Cloudflare edge, redirects, 404 and DNSSEC
        run: |
          set -u
          fail=0
          H=$(curl -sI "https://www.aiteampremium.com/")
          echo "$H" | grep -qi '^server: cloudflare' && echo "OK www served by Cloudflare" || { echo "FAIL www not served by Cloudflare"; fail=1; }
          echo "$H" | grep -qi '^x-vercel' && { echo "FAIL Vercel header present"; fail=1; } || echo "OK no Vercel headers"

          for src in "https://aiteampremium.com/pricing?m=1" "http://aiteampremium.com/pricing?m=1" "http://www.aiteampremium.com/pricing?m=1"; do
            out=$(curl -s -o /dev/null -w "%{http_code} %{redirect_url}" "$src")
            [ "$out" = "301 https://www.aiteampremium.com/pricing?m=1" ] && echo "OK $src -> $out" || { echo "FAIL $src -> $out"; fail=1; }
          done

          code=$(curl -s -o /dev/null -w "%{http_code}" "https://www.aiteampremium.com/monitor-404-probe")
          [ "$code" = "404" ] && echo "OK unknown URL 404" || { echo "FAIL unknown URL returned $code"; fail=1; }

          ad=$(curl -s "https://dns.google/resolve?name=www.aiteampremium.com&type=A" | grep -o '"AD":[a-z]*')
          [ "$ad" = '"AD":true' ] && echo "OK DNSSEC validates" || { echo "FAIL DNSSEC $ad"; fail=1; }

          mx=$(curl -s "https://dns.google/resolve?name=aiteampremium.com&type=MX" | grep -c 'zoho.com')
          [ "$mx" -ge 1 ] && echo "OK Zoho MX present" || { echo "FAIL Zoho MX missing"; fail=1; }

          exit $fail

  report:
    runs-on: ubuntu-latest
    needs: [health-check, edge-check]
    if: always()

    steps:
      - name: 📬 Generate report
        run: |
          cat > /tmp/monitor-report.txt << 'EOF'
          🔍 PRODUCTION MONITORING REPORT
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

          Website: https://www.aiteampremium.com

          Checks Performed:
          ✅ Homepage Status
          ✅ Content Verification
          ✅ Performance Metrics
          ✅ Security Headers
          ✅ SSL/TLS Certificate
          ✅ CDN Cache Status
          ✅ DNS Resolution
          ✅ Cloudflare edge, redirects, DNSSEC

          Report Time: $(date)
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

          Status: 🟢 OPERATIONAL
          EOF
          cat /tmp/monitor-report.txt
