name: Patch contact truth hotfix

on:
  push:
    branches: [hotfix/contact-truth-integrity-20260903]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/contact-truth-integrity-20260903
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply guarded contact truth repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('client/src/pages/Contact.tsx')
          s = p.read_text()

          def once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Contact.tsx :: {label}: expected 1 match, found {count}')
              s = s.replace(old, new)

          once(
              '{ icon: Phone, label: "WhatsApp / Phone", value: "+880 1533-262758", sub: "9 AM – 11 PM BST · 7 days", url: "tel:+8801533262758" },',
              '{ icon: Phone, label: "WhatsApp / Phone", value: "+880 1533-262758", sub: "WhatsApp is the primary contact channel", url: "tel:+8801533262758" },',
              'channel schedule',
          )
          once(
              'title: "Contact AI Team Premium — Order on WhatsApp (+880 1533-262758)",\n    description: "Order ChatGPT, Claude, Gemini and AI subscriptions in Bangladesh. WhatsApp +880 1533-262758 or fill out the form. Open 9 AM–11 PM BST, 7 days. We reply within 5–15 minutes.",\n    path: "/start-a-project",',
              'title: "Contact AI Team Premium — WhatsApp, Messenger & Phone",\n    description: "Contact AI Team Premium for current product availability, approved access model, payment instructions, support scope and next steps. Response and fulfillment timing vary and are confirmed for the specific request.",\n    path: "/contact",',
              'page meta',
          )
          once(
              'Need AI subscriptions, a website, or a brand makeover? Reach out — fastest response on WhatsApp.',
              'Need an AI subscription or digital service? WhatsApp is our primary contact channel; current availability, scope and next steps are confirmed for your request.',
              'hero response claim',
          )
          once(
              '<Clock size={12} /> সকাল ৯টা – রাত ১১টা · ৭ দিন · 9 AM – 11 PM BST · 7 days',
              '<Clock size={12} /> Response timing varies · WhatsApp is the primary channel',
              'hours badge',
          )
          once(
              '<Zap size={12} /> Delivery: 5–15 minutes',
              '<Zap size={12} /> Fulfillment timing confirmed for the specific offer',
              'delivery badge',
          )
          once(
              '<p style={{ color: "rgba(255,255,255,0.7)", fontSize: "0.78rem" }}>Fastest response — usually within minutes</p>',
              '<p style={{ color: "rgba(255,255,255,0.7)", fontSize: "0.78rem" }}>Primary contact channel · response timing varies</p>',
              'WhatsApp response claim',
          )
          once(
              '<p style={{ color: "rgba(255,255,255,0.7)", fontSize: "0.78rem" }}>Also fast — Facebook Messenger</p>',
              '<p style={{ color: "rgba(255,255,255,0.7)", fontSize: "0.78rem" }}>Facebook Messenger contact channel</p>',
              'Messenger speed claim',
          )
          once(
              '{isPending ? "Sending..." : "Submit Request"}',
              '{isPending ? "Opening WhatsApp..." : "Continue on WhatsApp"}',
              'submit semantics',
          )
          once(
              '<BreadcrumbSchema items={[{ name: "Home", path: "/" }, { name: "Contact", path: "/start-a-project" }]} />',
              '<BreadcrumbSchema items={[{ name: "Home", path: "/" }, { name: "Contact", path: "/contact" }]} />',
              'breadcrumb canonical',
          )
          p.write_text(s)

          p = Path('lib/route-meta.js')
          s = p.read_text()
          pattern = r'("/contact":\s*\{\s*title:\s*"Contact AI Team Premium — WhatsApp, Messenger, Email",\s*description:\s*)"[^"]*"'
          replacement = r'\1"Contact AI Team Premium for current availability, approved access model, payment instructions, support scope and next steps. Response and fulfillment timing vary by request."'
          s2, n = re.subn(pattern, replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'route-meta contact description: expected 1 match, found {n}')
          p.write_text(s2)

          p = Path('e2e/verify-all.spec.ts')
          s = p.read_text()
          if 'test.describe("Contact public truth"' in s:
              raise SystemExit('contact E2E already exists')
          s += '''\n\ntest.describe("Contact public truth", () => {\n  test("/contact is canonical and makes no fixed response or fulfillment promise", async ({ page }) => {\n    await page.goto(`${BASE}/contact`);\n    await page.waitForLoadState("networkidle");\n\n    const body = page.locator("body");\n    await expect(page.locator('link[rel="canonical"]')).toHaveAttribute("href", /\\/contact\\/?$/);\n    await expect(page.getByTestId("button-submit-contact")).toContainText("Continue on WhatsApp");\n    await expect(body).toContainText("Response timing varies", { ignoreCase: true });\n    await expect(body).toContainText("Fulfillment timing confirmed", { ignoreCase: true });\n    await expect(body).not.toContainText(/5\\s*[-–]\\s*15\\s*(?:min|minute)/i);\n    await expect(body).not.toContainText(/within\\s+(?:a few\\s+)?minutes/i);\n    await expect(body).not.toContainText(/9\\s*AM\\s*[-–]\\s*11\\s*PM/i);\n    await expect(body).not.toContainText(/30[- ]day\\s+(?:replacement\\s+)?warranty/i);\n  });\n\n  test("/start-a-project remains an alias of /contact", async ({ page }) => {\n    await page.goto(`${BASE}/start-a-project`);\n    await page.waitForLoadState("networkidle");\n    await expect(page.locator('link[rel="canonical"]')).toHaveAttribute("href", /\\/contact\\/?$/);\n    await expect(page.getByTestId("button-submit-contact")).toContainText("Continue on WhatsApp");\n  });\n});\n'''
          p.write_text(s)
          PY

          git diff --check
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/Contact.tsx lib/route-meta.js e2e/verify-all.spec.ts
          git commit -m "fix: remove unsupported contact SLA and canonical drift"
          git push origin HEAD:hotfix/contact-truth-integrity-20260903
