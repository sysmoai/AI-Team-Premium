name: Patch service truth quarantine

on:
  push:
    branches: [hotfix/service-truth-quarantine-20260903]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/service-truth-quarantine-20260903
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply guarded service quarantine
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          review_paths = [
              '/services',
              '/support',
              '/services/brand-design',
              '/services/web-development',
              '/services/digital-marketing',
              '/services/app-development',
              '/services/ai-advisory',
              '/services/ai-setup-security',
              '/services/ai-training',
              '/services/ai-automation',
          ]

          p = Path('shared/public-review.js')
          s = p.read_text()
          anchor = '  "/services/ai-ops-sprint",\n'
          if s.count(anchor) != 1:
              raise SystemExit('public-review service anchor drift')
          insert = ''.join(f'  "{path}",\n' for path in review_paths)
          s = s.replace(anchor, insert + anchor)
          p.write_text(s)

          p = Path('client/src/App.tsx')
          s = p.read_text()
          replacements = {
              '<Route path="/services/brand-design" component={BrandDesign} />': '<Route path="/services/brand-design" component={EvidenceReviewPage} />',
              '<Route path="/services/web-development" component={WebDevelopment} />': '<Route path="/services/web-development" component={EvidenceReviewPage} />',
              '<Route path="/services/digital-marketing" component={DigitalMarketing} />': '<Route path="/services/digital-marketing" component={EvidenceReviewPage} />',
              '<Route path="/services/app-development" component={AppDevelopment} />': '<Route path="/services/app-development" component={EvidenceReviewPage} />',
              '<Route path="/services/ai-advisory" component={AiAdvisory} />': '<Route path="/services/ai-advisory" component={EvidenceReviewPage} />',
              '<Route path="/services/ai-setup-security" component={AiSetupSecurity} />': '<Route path="/services/ai-setup-security" component={EvidenceReviewPage} />',
              '<Route path="/services/ai-training" component={AiTraining} />': '<Route path="/services/ai-training" component={EvidenceReviewPage} />',
              '<Route path="/services/ai-automation" component={AiAutomation} />': '<Route path="/services/ai-automation" component={EvidenceReviewPage} />',
              '<Route path="/support" component={Services} />': '<Route path="/support" component={EvidenceReviewPage} />',
              '<Route path="/services" component={Services} />': '<Route path="/services" component={EvidenceReviewPage} />',
          }
          for old, new in replacements.items():
              if s.count(old) != 1:
                  raise SystemExit(f'App route drift: {old}')
              s = s.replace(old, new)
          p.write_text(s)

          p = Path('lib/route-meta.js')
          s = p.read_text()
          old = '  "/about": { title: "About AI Team Premium — Bangladesh\'s Trusted AI Partner", description: "Learn about AI Team Premium, AI subscriptions for Bangladesh, paid in BDT via bKash or Nagad.", canonical: "https://www.aiteampremium.com/about" },'
          new = '  "/about": { title: "About AI Team Premium — Independent AI Access & Enablement Platform", description: "AI Team Premium is an independent Bangladesh-focused AI access and enablement platform. Commercial terms are confirmed before purchase.", canonical: "https://www.aiteampremium.com/about" },'
          if s.count(old) != 1:
              raise SystemExit('about route metadata drift')
          s = s.replace(old, new)
          p.write_text(s)

          p = Path('e2e/verify-all.spec.ts')
          s = p.read_text()
          if 'test.describe("Service commercial truth quarantine"' in s:
              raise SystemExit('service quarantine tests already exist')
          block = '''\n\nconst SERVICE_REVIEW_PATHS = [\n  "/services",\n  "/support",\n  "/services/ai-ops-sprint",\n  "/services/brand-design",\n  "/services/web-development",\n  "/services/digital-marketing",\n  "/services/app-development",\n  "/services/ai-advisory",\n  "/services/ai-setup-security",\n  "/services/ai-training",\n  "/services/ai-automation",\n  "/services/managed-ai-operations",\n];\n\ntest.describe("Service commercial truth quarantine", () => {\n  for (const path of SERVICE_REVIEW_PATHS) {\n    test(`${path} is preserved but non-commercial while evidence is incomplete`, async ({ page }) => {\n      await page.goto(`${BASE}${path}`);\n      await page.waitForLoadState("networkidle");\n      const body = page.locator("body");\n      await expect(page.locator("h1")).toHaveText("This commercial page is being re-verified");\n      await expect(page.locator('meta[name="robots"]')).toHaveAttribute("content", /noindex\\s*,\\s*follow/i);\n      await expect(body).not.toContainText(/৳\\s*[\\d,]+/);\n      await expect(body).not.toContainText(/\\b(?:5|7|14|15|21|30|45)[-– ]day\\b/i);\n      await expect(body).not.toContainText(/free\\s+(?:consultation|assessment|audit)/i);\n      await expect(body).not.toContainText(/4\\.2×|50[–-]200|35%/);\n    });\n  }\n\n  test("About metadata is evidence-safe", async ({ page }) => {\n    await page.goto(`${BASE}/about`);\n    await page.waitForLoadState("networkidle");\n    await expect(page).toHaveTitle(/About AI Team Premium/);\n    await expect(page).not.toHaveTitle(/Trusted AI Partner/i);\n    await expect(page.locator("body")).toContainText("independent Bangladesh-focused", { ignoreCase: true });\n  });\n});\n'''
          p.write_text(s + block)
          PY

          npm run gen:sitemap
          git diff --check
      - name: Commit quarantine
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/public-review.js client/src/App.tsx lib/route-meta.js e2e/verify-all.spec.ts
          git commit -m "fix: quarantine unverified service commercial claims"
          git push origin HEAD:hotfix/service-truth-quarantine-20260903
