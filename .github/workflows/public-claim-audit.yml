name: Temporary public claim audit

on:
  push:
    branches:
      - hotfix/public-claim-integrity-20260903

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan public rendering sources for unsupported promise patterns
        shell: bash
        run: |
          set -euo pipefail
          echo '=== quantitative delivery / response promises ==='
          grep -RInE --exclude-dir=node_modules --exclude='*.map' '([0-9]+[[:space:]]*[-–][[:space:]]*[0-9]+[[:space:]]*(min|minute|minutes|hour|hours|day|days).*(delivery|response|reply|support|replacement))|(within[[:space:]]+[0-9]+[[:space:]]*(min|minute|minutes|hour|hours|day|days))' client/src lib shared 2>/dev/null || true
          echo '=== warranty / guarantee / instant / trust absolutes ==='
          grep -RInEi --exclude-dir=node_modules --exclude='*.map' '(replacement guarantee|replacement SLA|warranty|24/7|trusted by Bangladesh|get access instantly|access instantly|no questions asked|guaranteed|fast delivery)' client/src lib shared 2>/dev/null || true
