name: Temporary public claim audit

on:
  push:
    branches:
      - hotfix/public-claim-integrity-20260903

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Identify blog slugs requiring evidence quarantine
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('client/src/data/blog-posts.ts').read_text(encoding='utf-8')
          hits = list(re.finditer(r'\n\s*slug:\s*"([^"]+)"', text))
          risky = re.compile(r'(AI Team Premium[\s\S]{0,500}(?:warranty|replacement|deliver(?:y|ed)|within\s+\d+\s*(?:min|minute|hour|day)|24/7)|(?:warranty|replacement|deliver(?:y|ed)|within\s+\d+\s*(?:min|minute|hour|day)|24/7)[\s\S]{0,500}AI Team Premium)', re.I)
          slugs=[]
          for i,m in enumerate(hits):
              end = hits[i+1].start() if i+1 < len(hits) else len(text)
              segment = text[m.start():end]
              if risky.search(segment):
                  slugs.append(m.group(1))
          print('BLOG_QUARANTINE_CANDIDATES=' + ','.join(slugs))
          print('COUNT=' + str(len(slugs)))
          PY
      - name: Scan public rendering sources for unsupported promise patterns
        shell: bash
        run: |
          set -euo pipefail
          echo '=== quantitative delivery / response promises ==='
          grep -RInE --exclude-dir=node_modules --exclude='*.map' '([0-9]+[[:space:]]*[-–][[:space:]]*[0-9]+[[:space:]]*(min|minute|minutes|hour|hours|day|days).*(delivery|response|reply|support|replacement))|(within[[:space:]]+[0-9]+[[:space:]]*(min|minute|minutes|hour|hours|day|days))' client/src lib shared 2>/dev/null || true
          echo '=== warranty / guarantee / instant / trust absolutes ==='
          grep -RInEi --exclude-dir=node_modules --exclude='*.map' '(replacement guarantee|replacement SLA|warranty|24/7|trusted by Bangladesh|get access instantly|access instantly|no questions asked|guaranteed|fast delivery)' client/src lib shared 2>/dev/null || true
