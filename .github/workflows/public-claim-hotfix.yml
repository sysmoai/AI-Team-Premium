          const prohibitedClaims = [
            [/\\b\\d+\\s*[-–]\\s*\\d+\\s*(?:min|minute|minutes|hour|hours)\\s+delivery\\b/gi, "fixed quantitative delivery promise"],
            [/30[- ]day\\s+(?:replacement\\s+)?(?:warranty|guarantee)/gi, "fixed 30-day warranty/guarantee"],
