name: Temporary public claim hotfix builder

on:
  push:
    branches:
      - hotfix/public-claim-integrity-20260903

permissions:
  contents: write

jobs:
  build-hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/public-claim-integrity-20260903
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install reproducibly
        run: npm ci --ignore-scripts

      - name: Align transformation runner with current routes
        run: python3 scripts/patch-public-claim-hotfix-runner.py

      - name: Apply public-claim transformations
        run: python3 scripts/apply-public-claim-hotfix.py

      - name: Regenerate product route metadata
        run: npm run gen:routes

      - name: Regenerate server structured data
        run: npm run gen:schema

      - name: Regenerate homepage static metadata
        run: npm run gen:index-meta

      - name: Regenerate sitemap
        run: npm run gen:sitemap

      - name: Dependency audit
        run: npm audit --audit-level=moderate

      - name: TypeScript
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Commercial validation
        run: npm run validate:commercial

      - name: Offline verification
        run: npm run verify

      - name: Commit generated hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api client lib scripts shared
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "hotfix: remove unsupported public SLA and warranty claims"
          git push origin HEAD:hotfix/public-claim-integrity-20260903
