name: Temporary public claim hotfix builder

on:
  push:
    branches:
      - hotfix/public-claim-integrity-20260903

permissions:
  contents: write

jobs:
  build-hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/public-claim-integrity-20260903
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install reproducibly
        run: npm ci --ignore-scripts
      - name: Apply guarded truth-surface transformations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')
          def write(path, text):
              Path(path).parent.mkdir(parents=True, exist_ok=True)
              Path(path).write_text(text, encoding='utf-8')
          def replace_once(path, old, new):
              text = read(path)
              if old not in text:
                  raise SystemExit(f'expected text not found in {path}: {old[:120]}')
              write(path, text.replace(old, new, 1))
          def regex_once(path, pattern, replacement, flags=0):
              text = read(path)
              out, n = re.subn(pattern, replacement, text, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f'expected exactly one regex match in {path}, got {n}: {pattern[:100]}')
              write(path, out)

          # -------------------------------------------------- governance registries
          quarantine = '''// Public-content quarantine for pages with confirmed high-risk claims that
          // contradict current evidence/governance. URLs stay reachable so ranking history is
          // preserved, but the disputed body/schema is suppressed until issue #20 is reconciled.
          export const QUARANTINED_BLOG_SLUGS = new Set([
            "chatgpt-plus-price-bangladesh-bkash-guide",
            "best-ai-tools-bangladeshi-university-students",
            "chatgpt-vs-claude-vs-gemini-bangladesh-freelancers",
            "pay-chatgpt-without-international-credit-card-bangladesh",
            "canva-pro-price-bangladesh-worth-it",
            "midjourney-vs-ideogram-vs-leonardo-ai-image-bangladesh",
            "buy-perplexity-pro-research-tool-bangladesh",
          ]);

          export function isQuarantinedBlogPath(path) {
            if (!path.startsWith("/blog/")) return false;
            const slug = path.slice("/blog/".length).replace(/\\\/$/, "");
            return QUARANTINED_BLOG_SLUGS.has(slug);
          }
          '''
          write('shared/content-quarantine.js', quarantine)

          public_review = '''import { CANONICAL_MAP } from "./canonical-map.js";

          // Legacy editorial/tool pages carry commercial claims that pre-date the current
          // evidence gates. Keep the URLs reachable, but render a neutral review page and
          // exclude them from indexing until their access model and terms are re-verified.
          const mappedCommercialAliases = Object.keys(CANONICAL_MAP).filter(
            (path) => path.startsWith("/tools/") || path.endsWith("-plans"),
          );

          export const PUBLIC_REVIEW_PATHS = new Set([
            ...mappedCommercialAliases,
            "/tools/vault",
            "/tools/linkedin",
            "/chatgpt/plus-starter-shared",
            "/chatgpt/plus-premium-shared",
            "/chatgpt/plus-personal-seat",
            "/chatgpt/team-starter-shared",
            "/chatgpt/team-premium-shared",
            "/chatgpt/team-personal-seat",
            "/chatgpt/go-personal",
            "/chatgpt/pro-premium-shared",
            "/chatgpt/pro-personal-seat",
            "/services/ai-ops-sprint",
            "/services/managed-ai-operations",
          ]);

          export function isPublicReviewPath(path) {
            const normalized = path.length > 1 ? path.replace(/\\\/$/, "") : path;
            return PUBLIC_REVIEW_PATHS.has(normalized);
          }
          '''
          write('shared/public-review.js', public_review)

          evidence_page = '''import { useEffect } from "react";
          import { Link, useLocation } from "wouter";
          import { Layout } from "@/components/layout/Layout";
          import { BRAND } from "@/components/brand/LogoIcons";
          import { usePageMeta } from "@/hooks/use-page-meta";
          import { CANONICAL_MAP } from "@shared/canonical-map.js";

          export default function EvidenceReviewPage() {
            const [location] = useLocation();
            const canonical = (CANONICAL_MAP as Record<string, string | undefined>)[location];
            const destination = canonical || "/all-products";

            usePageMeta({
              title: "Commercial Page Under Evidence Review",
              description: "This page is temporarily under evidence review. Current access model, availability, fulfillment timing and support terms are confirmed before purchase.",
              path: location,
            });

            useEffect(() => {
              const meta = document.querySelector<HTMLMetaElement>('meta[name="robots"]');
              const previous = meta?.content;
              if (meta) meta.content = "noindex, follow";
              return () => {
                if (meta && previous) meta.content = previous;
              };
            }, []);

            return (
              <Layout>
                <section className="py-24" style={{ background: BRAND.sky }}>
                  <div className="mx-auto max-w-2xl px-6 text-center">
                    <p className="uppercase mb-3" style={{ color: BRAND.blue, fontSize: "0.72rem", letterSpacing: "0.16em", fontWeight: 700 }}>Evidence review</p>
                    <h1 style={{ color: BRAND.navy, fontSize: "clamp(1.8rem,5vw,2.6rem)", fontWeight: 800 }}>This commercial page is being re-verified</h1>
                    <p className="mt-5" style={{ color: BRAND.navy, opacity: 0.68, lineHeight: 1.8 }}>
                      We are re-checking provider policy, access model, current availability, fulfillment timing and support terms before publishing commercial claims here again. The URL remains available so existing links are not broken.
                    </p>
                    <div className="mt-8 flex flex-wrap justify-center gap-3">
                      <Link href={destination} className="rounded-full px-6 py-3 font-semibold text-white" style={{ background: BRAND.blue, textDecoration: "none" }}>
                        {canonical ? "View current canonical page" : "Browse current catalog"}
                      </Link>
                      <Link href="/contact" className="rounded-full px-6 py-3 font-semibold" style={{ color: BRAND.navy, background: BRAND.white, textDecoration: "none", border: "1px solid rgba(15,23,42,.12)" }}>
                        Contact us
                      </Link>
                    </div>
                  </div>
                </section>
              </Layout>
            );
          }
          '''
          write('client/src/pages/EvidenceReviewPage.tsx', evidence_page)

          # -------------------------------------------------- route containment
          app = read('client/src/App.tsx')
          marker = 'const ManagedAiOperations = lazy(() => import("@/pages/services/ManagedAiOperations"));'
          if marker not in app:
              raise SystemExit('App.tsx lazy marker not found')
          app = app.replace(marker, marker + '\nconst EvidenceReviewPage = lazy(() => import("@/pages/EvidenceReviewPage"));', 1)
          review_paths = [
            '/chatgpt-plans','/claude-plans','/gemini-plans','/grammarly-plans','/canva-plans','/perplexity-plans','/grok-plans',
            '/chatgpt/plus-starter-shared','/chatgpt/plus-premium-shared','/chatgpt/plus-personal-seat','/chatgpt/team-starter-shared','/chatgpt/team-premium-shared','/chatgpt/team-personal-seat','/chatgpt/go-personal','/chatgpt/pro-premium-shared','/chatgpt/pro-personal-seat',
            '/tools/chatgpt','/tools/claude','/tools/gemini','/tools/supergrok','/tools/perplexity','/tools/grok','/tools/google-ai-pro','/tools/midjourney','/tools/leonardo','/tools/runway','/tools/kling','/tools/grammarly','/tools/canva','/tools/copilot','/tools/firefly','/tools/ideogram','/tools/freepik','/tools/poe','/tools/microsoft365','/tools/vault','/tools/elevenlabs','/tools/notion','/tools/linkedin','/tools/manus','/tools/adobe-cc',
            '/services/ai-ops-sprint','/services/managed-ai-operations',
          ]
          for path in review_paths:
              pat = rf'(<Route path="{re.escape(path)}" component=\{{)[A-Za-z0-9_]+(\}} />)'
              app, n = re.subn(pat, r'\1EvidenceReviewPage\2', app, count=1)
              if n != 1:
                  raise SystemExit(f'route not found for review containment: {path}')
          write('client/src/App.tsx', app)

          # Server noindex/evidence-review branch.
          replace_once('api/index.js',
            'import { isQuarantinedBlogPath } from "../shared/content-quarantine.js";\n',
            'import { isQuarantinedBlogPath } from "../shared/content-quarantine.js";\nimport { isPublicReviewPath } from "../shared/public-review.js";\n')
          replace_once('api/index.js',
            '  if (isQuarantinedBlogPath(path)) {\n',
            '''  if (isPublicReviewPath(path)) {
    const body = makeNonIndexable(
      inject(template, {
        title: "Commercial Page Under Evidence Review | AI Team Premium",
        description:
          "This commercial page is temporarily under evidence review. Current access model, availability, fulfillment timing and support terms are confirmed before purchase.",
        canonical: meta.canonical || SITE_URL + path,
      })
    );
    res.setHeader("Content-Type", "text/html; charset=utf-8");
    res.setHeader("Cache-Control", "public, max-age=0, must-revalidate");
    res.setHeader("X-Robots-Tag", "noindex, follow");
    res.status(200).send(body);
    return;
  }

  if (isQuarantinedBlogPath(path)) {
''')

          # Keep review URLs out of the sitemap while preserving the routes.
          replace_once('scripts/gen-sitemap.mjs',
            'const { isQuarantinedBlogPath } = await import(\n  pathToFileURL(resolve(ROOT, "shared/content-quarantine.js")).href\n);\n',
            'const { isQuarantinedBlogPath } = await import(\n  pathToFileURL(resolve(ROOT, "shared/content-quarantine.js")).href\n);\nconst { isPublicReviewPath } = await import(\n  pathToFileURL(resolve(ROOT, "shared/public-review.js")).href\n);\n')
          replace_once('scripts/gen-sitemap.mjs',
            '  if (isQuarantinedBlogPath(path)) return true;\n',
            '  if (isQuarantinedBlogPath(path)) return true;\n  if (isPublicReviewPath(path)) return true;\n')

          # -------------------------------------------------- safe high-value hubs
          ai_subs = '''import { Link } from "wouter";
          import { Layout } from "@/components/layout/Layout";
          import { BRAND, WhatsAppIcon } from "@/components/brand/LogoIcons";
          import { usePageMeta } from "@/hooks/use-page-meta";
          import { BreadcrumbSchema } from "@/components/seo/JsonLd";
          import { config } from "@/lib/config";
          import { trackWhatsAppClick } from "@/lib/analytics";

          export default function AISubscriptions() {
            usePageMeta({
              title: "AI Subscriptions in Bangladesh — Browse Current Catalog",
              description: "Browse current AI subscription options for Bangladesh. Access model, price, availability, fulfillment timing and support terms are confirmed before purchase.",
              path: "/ai-subscriptions",
