          const claimLeaks = prohibitedClaims.map(([re, label]) => { re.lastIndex = 0; const n = (publicText.match(re) || []).length; return [label, n]; }).filter(([, n]) => n > 0);
          if (claimLeaks.length === 0) ok("critical public surfaces contain no fixed SLA/warranty/trust/stock claims");
