              <BreadcrumbSchema items={[{ name: "Home", path: "/" }, { name: "AI Subscriptions", path: "/ai-subscriptions" }]} />
              <section className="py-24" style={{ background: BRAND.sky }}>
                <div className="mx-auto max-w-5xl px-6 lg:px-10 text-center">
                  <p className="uppercase mb-3" style={{ color: BRAND.blue, fontSize: "0.72rem", letterSpacing: "0.16em", fontWeight: 700 }}>Current catalog</p>
                  <h1 style={{ color: BRAND.navy, fontSize: "clamp(1.9rem,5vw,3rem)", fontWeight: 800 }}>AI subscriptions for Bangladesh</h1>
                  <p className="mt-5 mx-auto max-w-2xl" style={{ color: BRAND.navy, opacity: 0.65, lineHeight: 1.8 }}>Explore current options without relying on fixed public delivery, warranty or availability promises. Commercial terms are confirmed for the specific offer before purchase.</p>
                  <div className="grid md:grid-cols-3 gap-5 mt-12 text-left">
                    {cards.map((card) => <div key={card.title} className="rounded-2xl p-6" style={{ background: BRAND.white, border: "1px solid rgba(37,99,235,.08)" }}>
                      <h2 style={{ color: BRAND.navy, fontWeight: 700 }}>{card.title}</h2>
                      <p className="mt-3" style={{ color: BRAND.navy, opacity: 0.6, lineHeight: 1.7, fontSize: "0.9rem" }}>{card.body}</p>
                      <Link href={card.href} className="inline-flex mt-5 font-semibold" style={{ color: BRAND.blue, textDecoration: "none" }}>{card.cta}</Link>
                    </div>)}
                  </div>
                  <a href={config.whatsappGeneral} target="_blank" rel="noopener noreferrer" onClick={() => trackWhatsAppClick(undefined, undefined, undefined, "ai-subscriptions-safe-hub")} className="inline-flex items-center gap-2 rounded-full px-7 py-3.5 mt-10 font-semibold text-white" style={{ background: "#25D366", textDecoration: "none" }}><WhatsAppIcon size={17} color="#fff" /> Ask on WhatsApp</a>
                </div>
              </section>
            </Layout>;
          }
          '''
          write('client/src/pages/AISubscriptions.tsx', ai_subs)

          about = '''import { Link } from "wouter";
          import { Layout } from "@/components/layout/Layout";
          import { BRAND } from "@/components/brand/LogoIcons";
          import { usePageMeta } from "@/hooks/use-page-meta";
          import { BreadcrumbSchema } from "@/components/seo/JsonLd";

          export default function About() {
            usePageMeta({
              title: "About AI Team Premium",
              description: "AI Team Premium is an independent Bangladesh-focused AI access and enablement platform. Commercial terms are confirmed before purchase.",
              path: "/about",
            });
            return <Layout>
              <BreadcrumbSchema items={[{ name: "Home", path: "/" }, { name: "About", path: "/about" }]} />
              <section className="py-24" style={{ background: BRAND.sky }}>
                <div className="mx-auto max-w-3xl px-6 lg:px-10">
                  <p className="uppercase mb-3" style={{ color: BRAND.blue, fontSize: "0.72rem", letterSpacing: "0.16em", fontWeight: 700 }}>About</p>
                  <h1 style={{ color: BRAND.navy, fontSize: "clamp(2rem,5vw,3rem)", fontWeight: 800 }}>AI access, evaluation and implementation support for Bangladesh</h1>
                  <div className="mt-8 space-y-5" style={{ color: BRAND.navy, opacity: 0.72, lineHeight: 1.85 }}>
                    <p>AI Team Premium is an independent Bangladesh-focused platform that helps people and businesses evaluate AI tools, coordinate locally supported ordering and payment steps, and get practical setup or implementation support.</p>
                    <p>Before a purchase, we confirm the specific access model, current price, availability, fulfillment timing and any applicable support, recovery, refund or replacement terms. We do not treat an old public claim as a standing promise when current evidence is not available.</p>
                    <p>AI Team Premium is not presented as an official partner of third-party AI providers unless a specific relationship is independently verified and disclosed.</p>
                  </div>
                  <div className="mt-8 flex flex-wrap gap-3">
                    <Link href="/all-products" className="rounded-full px-6 py-3 font-semibold text-white" style={{ background: BRAND.blue, textDecoration: "none" }}>Browse current catalog</Link>
                    <Link href="/non-affiliation" className="rounded-full px-6 py-3 font-semibold" style={{ background: BRAND.white, color: BRAND.navy, textDecoration: "none", border: "1px solid rgba(15,23,42,.12)" }}>Non-affiliation disclosure</Link>
                  </div>
                </div>
              </section>
            </Layout>;
          }
          '''
          write('client/src/pages/About.tsx', about)

          # -------------------------------------------------- ordering/trust component
          trust = '''import { MessageSquare, CreditCard, ClipboardCheck, Shield } from "lucide-react";
          import { WhatsAppIcon } from "@/components/brand/LogoIcons";

          interface TrustAndBuySectionProps { productName?: string; whatsappText?: string; }

          export function TrustAndBuySection({ productName, whatsappText }: TrustAndBuySectionProps) {
            const waText = whatsappText ?? `Hi! I want to ask about ${productName ?? "an AI subscription"}. Please confirm the current access model, price, availability, fulfillment timing and support terms before payment.`;
            const waUrl = `https://wa.me/8801533262758?text=${encodeURIComponent(waText)}`;
            const steps = [
              { icon: MessageSquare, title: "Ask on WhatsApp", body: "Tell us the product and plan you are considering." },
              { icon: ClipboardCheck, title: "Confirm the offer", body: "We confirm the access model, current price, availability, fulfillment timing and applicable support terms." },
              { icon: CreditCard, title: "Pay only after confirmation", body: "Use the payment instructions supplied for the confirmed order." },
            ];
            return <div className="space-y-8">
              <div>
                <h2 className="text-xl font-bold text-gray-900 dark:text-gray-100 mb-5">How ordering works</h2>
                <div className="grid sm:grid-cols-3 gap-4">{steps.map(({icon:Icon,title,body}) => <div key={title} className="rounded-2xl p-5 bg-white dark:bg-gray-900 border border-gray-100 dark:border-gray-800"><Icon size={20} className="text-blue-600 dark:text-blue-400"/><h3 className="mt-3 font-bold text-sm text-gray-900 dark:text-gray-100">{title}</h3><p className="mt-2 text-xs leading-relaxed text-gray-500 dark:text-gray-400">{body}</p></div>)}</div>
              </div>
              <div className="rounded-2xl p-5 border border-blue-200/60 dark:border-blue-900/60 bg-blue-50/50 dark:bg-blue-950/20 flex gap-3"><Shield size={21} className="text-blue-600 dark:text-blue-400 shrink-0"/><div><h3 className="font-bold text-sm text-gray-900 dark:text-gray-100">Support and recovery terms</h3><p className="mt-2 text-xs leading-relaxed text-gray-600 dark:text-gray-400">Support, recovery, refund or replacement eligibility is confirmed for the specific order before payment. Do not rely on a fixed public SLA or warranty from older site copy.</p></div></div>
              <a href={waUrl} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 px-7 py-3.5 rounded-full text-white font-semibold text-sm" style={{ background: "#25D366", textDecoration: "none" }}><WhatsAppIcon size={18} color="#fff" /> Ask on WhatsApp</a>
            </div>;
          }
          '''
          write('client/src/components/product/TrustAndBuySection.tsx', trust)

          # -------------------------------------------------- legal truth reset
          terms = '''import { Layout } from "@/components/layout/Layout";
          import { BRAND } from "@/components/brand/LogoIcons";
          import { usePageMeta } from "@/hooks/use-page-meta";

          export default function TermsOfService() {
            usePageMeta({ title: "Terms of Service", description: "Current ordering and service-term disclosure for AI Team Premium. Order-specific commercial terms are confirmed before payment.", path: "/terms" });
            return <Layout><section className="py-20"><div className="mx-auto max-w-3xl px-6 lg:px-10"><h1 style={{ color: BRAND.navy, fontSize: "2.2rem", fontWeight: 800 }}>Terms of Service</h1><div className="mt-8 space-y-6" style={{ color: BRAND.navy, opacity: 0.72, lineHeight: 1.85 }}>
              <p>These public terms describe the current ordering process at a high level. Before payment, AI Team Premium confirms the specific product or service, access model, current price, availability, fulfillment expectations and any order-specific support, recovery, refund or replacement terms.</p>
              <p>Third-party AI products remain subject to their providers' own terms, eligibility rules and account policies. AITP does not grant permission to bypass provider restrictions.</p>
              <p>Older site copies may have contained fixed delivery, warranty or replacement promises. Those statements are not a substitute for the written terms confirmed for the current order.</p>
              <p>Do not send passwords, recovery codes or other sensitive account credentials unless a verified workflow explicitly requires a secure handoff. Contact us before payment if any term is unclear.</p>
              <p>Applicable consumer rights and law are not waived by this page.</p>
            </div></div></section></Layout>;
          }
          '''
          write('client/src/pages/legal/TermsOfService.tsx', terms)

          refund = '''import { Layout } from "@/components/layout/Layout";
          import { BRAND } from "@/components/brand/LogoIcons";
          import { usePageMeta } from "@/hooks/use-page-meta";

          export default function RefundPolicy() {
            usePageMeta({ title: "Refund, Recovery & Replacement Policy", description: "Current refund, recovery and replacement disclosure for AI Team Premium. Eligibility and timing are confirmed for the specific order before payment.", path: "/refund-policy" });
            return <Layout><section className="py-20"><div className="mx-auto max-w-3xl px-6 lg:px-10"><h1 style={{ color: BRAND.navy, fontSize: "2.2rem", fontWeight: 800 }}>Refund, Recovery & Replacement Policy</h1><div className="mt-8 space-y-6" style={{ color: BRAND.navy, opacity: 0.72, lineHeight: 1.85 }}>
              <p>Refund, recovery, replacement or service-credit eligibility depends on the specific offer, the confirmed order terms, the cause of the issue and applicable law. We confirm any applicable terms before payment.</p>
              <p>We do not publish a universal fixed replacement SLA or warranty period while those terms are under evidence review. If access or service fails, contact support with the order details so the case can be assessed against the terms confirmed for that order.</p>
              <p>Third-party provider outages, provider-policy changes, misuse, account-security events and customer-controlled account changes can affect what remedies are technically or contractually available.</p>
              <p>If a current order has written refund, recovery or replacement terms, those order-specific terms and applicable law govern rather than an older website claim.</p>
            </div></div></section></Layout>;
          }
          '''
          write('client/src/pages/legal/RefundPolicy.tsx', refund)

          # Privacy: current contact form is a WhatsApp handoff, not DB persistence.
          privacy = read('client/src/pages/legal/PrivacyPolicy.tsx')
          privacy = privacy.replace('To provide post-delivery support and warranty service.', 'To provide post-purchase support and respond to service issues.')
          privacy = privacy.replace('We retain order data for up to 12 months for warranty and support purposes. Contact form submissions are stored in our PostgreSQL database and reviewed only by our support team. You may request deletion at any time by messaging us on WhatsApp.', 'The current contact form prepares a WhatsApp message and does not persist the form payload to an AI Team Premium database. If you continue in WhatsApp, that conversation is processed through WhatsApp/Meta under their applicable terms. You may contact us to request deletion of information we control, subject to legal and operational retention requirements.')
          write('client/src/pages/legal/PrivacyPolicy.tsx', privacy)

          # -------------------------------------------------- contact page
          contact = read('client/src/pages/Contact.tsx')
          contact = re.sub(r'const CONTACT_FAQS = \[[\s\S]*?\n\];', '''const CONTACT_FAQS = [
            { q: "How do I contact AI Team Premium?", a: "WhatsApp is the primary contact channel. The form on this page prepares a WhatsApp message so you can send the request with the details already filled in." },
            { q: "How quickly will I receive a reply?", a: "Response times vary. WhatsApp is generally the fastest channel, but we do not publish a fixed response SLA." },
            { q: "When will an order be fulfilled?", a: "Current availability and fulfillment timing are confirmed for the specific offer before payment." },
            { q: "What should I include in my message?", a: "Tell us the product or service, your preferred plan if known, and what you need help with. Do not send passwords or recovery codes in the initial message." },
          ];''', contact, count=1)
          contact = contact.replace('Contact AI Team Premium in Bangladesh — WhatsApp +880 1533-262758. Fast 5–15 min response for AI subscription orders, support, and digital services.', 'Contact AI Team Premium in Bangladesh for current product availability, ordering, support and digital-service enquiries. Response and fulfillment timing vary by request.')
          contact = contact.replace('{ icon: Clock, label: "Delivery", value: "5–15 minutes" },', '{ icon: Clock, label: "Fulfillment timing", value: "Confirmed before payment" },')
          contact = contact.replace('We respond fastest on WhatsApp — usually within minutes', 'WhatsApp is our primary contact channel — response times vary')
          contact = contact.replace("We'll get back to you within 24 hours.", "The form prepares a WhatsApp message; send it there to continue.")
          write('client/src/pages/Contact.tsx', contact)

          # -------------------------------------------------- home truth reset
          home = read('client/src/pages/Home.tsx')
          home = re.sub(r'const DIFFERENTIATORS = \[[\s\S]*?\n\];', '''const DIFFERENTIATORS = [
            { icon: CreditCard, title: "Local payment coordination", desc: "Current BDT payment instructions are confirmed before payment" },
            { icon: Clock, title: "Fulfillment timing", desc: "Confirmed for the specific offer before payment" },
            { icon: Headphones, title: "WhatsApp support", desc: "Bangla + English support channel" },
            { icon: RefreshCw, title: "Support & recovery terms", desc: "Confirmed for the specific order before payment" },
          ];''', home, count=1)
          home = re.sub(r'const FAQS = \[[\s\S]*?\n\];', '''const FAQS = [
            { q: "কীভাবে অর্ডার করব?", a: "WhatsApp-এ যে AI tool বা service দরকার সেটি জানান। Payment-এর আগে আমরা current price, access model, availability, fulfillment timing এবং applicable support terms confirm করি।" },
