name: Deploy to Vercel + Update Domain

on:
  push:
    branches: [main]

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://www.aiteampremium.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          NODE_ENV: production

      - name: 🚀 Deploy to Vercel
        uses: vercel/action@v5
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          prod: true
        id: vercel-deploy

      - name: ✅ Verify Vercel deployment
        run: |
          DEPLOYMENT_URL="${{ steps.vercel-deploy.outputs.preview-url }}"
          if [[ $DEPLOYMENT_URL == *"vercel.app"* ]]; then
            echo "✅ Vercel deployment successful: $DEPLOYMENT_URL"
            # Wait for deployment to be ready
            for i in {1..30}; do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$DEPLOYMENT_URL")
              if [ "$HTTP_CODE" = "200" ]; then
                echo "✅ Deployment is live and responding"
                exit 0
              fi
              echo "Waiting for deployment... attempt $i (HTTP $HTTP_CODE)"
              sleep 2
            done
            echo "❌ Deployment did not respond in time"
            exit 1
          else
            echo "❌ Invalid deployment URL: $DEPLOYMENT_URL"
            exit 1
          fi

      - name: 🌐 Verify www.aiteampremium.com
        run: |
          for i in {1..20}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://www.aiteampremium.com")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ www.aiteampremium.com is live (HTTP $HTTP_CODE)"
              # Get page title to verify content
              TITLE=$(curl -s "https://www.aiteampremium.com" | grep -o '<title>[^<]*</title>' | sed 's/<[^>]*>//g' | head -c 50)
              echo "✅ Page title: $TITLE"
              exit 0
            fi
            echo "Checking www.aiteampremium.com... attempt $i (HTTP $HTTP_CODE)"
            sleep 3
          done
          echo "⚠️ www.aiteampremium.com not responding yet (DNS may need propagation)"
          exit 0

      - name: 📊 Performance check
        run: |
          echo "Performance Metrics:"
          curl -sI "https://www.aiteampremium.com" | grep -E "Server:|Cache-Control:|Age:|X-Vercel-Cache:"

      - name: 📬 Deployment notification
        if: success()
        run: |
          echo "🎉 DEPLOYMENT SUCCESSFUL"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Website: https://www.aiteampremium.com"
          echo "✅ Domain: aiteampremium.com (active)"
          echo "✅ Server: Vercel Production"
          echo "✅ Commit: ${{ github.sha }}"
          echo "✅ Branch: ${{ github.ref }}"
          echo "✅ Deployed by: ${{ github.actor }}"
          echo "✅ Time: $(date)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: ❌ Deployment failed notification
        if: failure()
        run: |
          echo "❌ DEPLOYMENT FAILED"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref }}"
          echo "Actor: ${{ github.actor }}"
          echo "Time: $(date)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          exit 1

  health-check:
    runs-on: ubuntu-latest
    needs: deploy
    if: success()
    timeout-minutes: 5

    steps:
      - name: Health check
        run: |
          echo "Running health checks on www.aiteampremium.com..."

          # Check homepage
          curl -s "https://www.aiteampremium.com" | grep -q "ChatGPT\|Claude\|Gemini" && echo "✅ Products found"

          # Check WhatsApp integration
          curl -s "https://www.aiteampremium.com" | grep -q "8801" && echo "✅ WhatsApp integration present"

          # Check pricing
          curl -s "https://www.aiteampremium.com" | grep -q "৳\|pricing" && echo "✅ Pricing configured"

          echo "✅ All health checks passed!"
